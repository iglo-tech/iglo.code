name: Bun runtime compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    name: Bun source and archive (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-12vcpu-macos-26
            platform: mac
            target: darwin-arm64
            arch: arm64
          - runner: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            target: linux-x64
            arch: x64
          - runner: blacksmith-8vcpu-ubuntu-2404-arm
            platform: linux
            target: linux-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned browser
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            bun apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi
          bun -e 'import { previewBrowserRelease } from "./apps/server/src/preview/PreviewBrowser.ts"; const release = previewBrowserRelease(process.platform, process.arch); if (!release) throw new Error("Unsupported browser target"); process.stdout.write(JSON.stringify(release));' > "$RUNNER_TEMP/chrome-release.json"
          chrome_url=$(bun -e 'console.log(JSON.parse(await Bun.file(process.argv[1]).text()).url)' "$RUNNER_TEMP/chrome-release.json")
          chrome_sha=$(bun -e 'console.log(JSON.parse(await Bun.file(process.argv[1]).text()).sha256)' "$RUNNER_TEMP/chrome-release.json")
          chrome_platform=$(bun -e 'console.log(JSON.parse(await Bun.file(process.argv[1]).text()).platform)' "$RUNNER_TEMP/chrome-release.json")
          curl -fL "$chrome_url" -o "$RUNNER_TEMP/chrome.zip"
          bun -e 'import { createHash } from "node:crypto"; const actual = createHash("sha256").update(await Bun.file(process.argv[1]).arrayBuffer()).digest("hex"); if (actual !== process.argv[2]) throw new Error("Chromium checksum mismatch");' "$RUNNER_TEMP/chrome.zip" "$chrome_sha"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/chrome"
          echo "T3_WEB_REGRESSION_BROWSER=$RUNNER_TEMP/chrome/chrome-headless-shell-$chrome_platform/chrome-headless-shell" >> "$GITHUB_ENV"
          echo "T3_WEB_REGRESSION_ARTIFACTS=$RUNNER_TEMP/web-regression-source" >> "$GITHUB_ENV"
      - name: Bun source transport and persistence
        run: bun scripts/smoke-cli-archive.ts --source
      - name: Bun source native and helper boundaries
        run: bun apps/server/scripts/smoke-native-runtime.ts source
      - name: Real development web client
        run: bun apps/server/scripts/web-client-regression.ts source
      - name: Pinned Device tools with Bun only
        run: bun apps/server/scripts/smoke-device-tools.ts
      - name: Build client, server, and native monitor
        shell: bash
        run: |
          vp run --filter t3 build
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/resource-monitor/${{ matrix.target }}"
          cp native/resource-monitor/target/release/t3-resource-monitor "$RUNNER_TEMP/resource-monitor/${{ matrix.target }}/t3-resource-monitor"
          bun apps/server/scripts/cli.ts build-exe --target "${{ matrix.target }}"
          version=$(bun -e 'console.log((await Bun.file("apps/server/package.json").json()).version)')
          bun scripts/build-cli-archive.ts --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --version "$version" --resource-monitor-dir "$RUNNER_TEMP/resource-monitor" --output-dir "$RUNNER_TEMP/release-cli"
          echo "T3_RUNTIME_ARCHIVE=$RUNNER_TEMP/release-cli/t3-$version-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"
          echo "T3_RUNTIME_VERSION=$version" >> "$GITHUB_ENV"
      - name: Extracted archive transport and persistence without system runtimes
        run: bun scripts/smoke-cli-archive.ts --archive "$T3_RUNTIME_ARCHIVE" --expect-version "$T3_RUNTIME_VERSION"
      - name: Archive native and helper boundaries
        run: bun apps/server/scripts/smoke-native-runtime.ts archive "$T3_RUNTIME_ARCHIVE"
      - name: Compiled service update and rollback
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/service-runtime"
          tar -xf "$T3_RUNTIME_ARCHIVE" -C "$RUNNER_TEMP/service-runtime"
          T3_SERVICE_TEST_EXECUTABLE="$RUNNER_TEMP/service-runtime/t3-$T3_RUNTIME_VERSION-${{ matrix.target }}/t3" vp test run apps/server/src/serviceLauncher.runtime.test.ts
      - name: Real shipped web client
        env:
          T3_WEB_REGRESSION_ARTIFACTS: ${{ runner.temp }}/web-regression-archive
        run: bun apps/server/scripts/web-client-regression.ts archive "$T3_RUNTIME_ARCHIVE" "$T3_RUNTIME_VERSION"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-runtime-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/web-regression-source
            ${{ runner.temp }}/web-regression-archive
          if-no-files-found: ignore
