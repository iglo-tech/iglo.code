name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
              - --filter=@t3tools/monorepo
              - --filter=@t3tools/oxlint-plugin-t3code...
              - --filter=@t3tools/scripts...
              - --filter=t3...

      - name: Check formatting and lint
        run: |
          vp fmt --check
          vp run lint

      - name: Typecheck web, server, and dependencies
        # No-emit checks read source directly; the plugin contract/fixture dependencies form a cycle.
        run: vp run --parallel --filter 't3...' --concurrency-limit 2 typecheck

      - name: Run smoke tests
        run: >-
          vp test run
          packages/contracts/src/environmentHttp.test.ts
          packages/client-runtime/src/state/threadHistoryMerge.test.ts
          apps/server/src/orchestration-v2/CommandPolicy.test.ts

      - name: Build web and server
        run: vp run --filter t3 build
